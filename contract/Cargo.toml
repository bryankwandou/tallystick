[package]
name = "z-tenant-settle"
version = "0.1.0"
edition = "2021"
description = "Tallystick settlement contract — emits an enclave-written receipt for an agent's signed claim."
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
wit-bindgen = { version = "0.49", default-features = false, features = ["macros", "realloc"] }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
